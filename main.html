]<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>

    <style>

        table {
            border-collapse: collapse;
        }

        table, th, td {
            border: 2px solid black;
        }

        th, td {
            padding: 10px;
            text-align: center;
            font-size: 20px;
        }

        .main-table {
            width: 100%;
            height: 100vh;
        }

        ul {
            text-align: left;
            margin-left: 30px;
        }

        .black-cell {
            background-color: black;
            color: white;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <table class="main-table">

        <tr>

            <!-- Nested Table 2 -->
            <td>

                <table width="100%">

                    <tr>
                        <th colspan="2">Nested Table 2</th>
                    </tr>

                    <tr>
                        <th>Column 1</th>
                        <th>Column 2</th>
                    </tr>

                    <tr>
                        <td>abc</td>
                        <td>def</td>
                    </tr>

                </table>

            </td>

            <!-- Nested Table 1 -->
            <td>

                <table width="100%">

                    <tr>
                        <th>Nested Table 1</th>
                    </tr>

                    <tr>
                        <td>

                            <ul>
                                <li>List item 1</li>
                                <li>List item 2</li>
                                <li>List item 3</li>
                            </ul>

                        </td>
                    </tr>

                </table>

            </td>

        </tr>

        <tr>

            <!-- Nested Table 3 -->
            <td>

                <table width="100%">

                    <tr>
                        <th colspan="2">Nested Table 3</th>
                    </tr>

                    <tr>

                        <td>
                            <a href="bbb">Nested Table</a>
                        </td>

                        <td>
                            Demo Continued
                        </td>

                    </tr>

                </table>

            </td>

            <!-- Nested Table 4 -->
            <td>

                <table width="100%">

                    <tr>
                        <th>Nested Table 4</th>
                    </tr>

                    <tr>
                        <td class="black-cell">
                            HTML
                        </td>
                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>

</html>
